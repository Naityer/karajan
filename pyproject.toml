[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "karajan"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.7,<3.0",
    "PyJWT[crypto]>=2.9,<3.0",
    "typer>=0.12,<1.0",
    "httpx>=0.27,<1.0",
    "rich>=13.0,<14.0",
    "prompt_toolkit>=3.0,<4.0",
    "pyfiglet>=1.0,<2.0",
    "openpyxl>=3.1,<4.0",
]

[project.scripts]
karajan = "karajan_cli.main:run"

[tool.setuptools.packages.find]
include = ["app*", "karajan_cli*"]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0"]
